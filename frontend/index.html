<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiraiable</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Hiraiable</h1>
        <p>Students currently in the bootcamp</p>
    </header>

    <main>
        <section class="card">
            <h2>Add a student</h2>
            <form id="student-form">
                <div class="field">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="field">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" min="15" max="100" required>
                </div>
                <div class="field">
                    <label for="city">City</label>
                    <input type="text" id="city" name="city" required>
                </div>
                <button type="submit">Add</button>
            </form>
            <p id="message"></p>
        </section>

        <section class="card">
            <h2>Current students</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>City</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="students-body">
                    <!-- Fake rows for now. JavaScript will replace them later. -->
                    <tr>
                        <td>1</td>
                        <td>Ali</td>
                        <td>20</td>
                        <td>Islamabad</td>
                        <td><button class="delete-btn">Delete</button></td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Sara</td>
                        <td>22</td>
                        <td>Lahore</td>
                        <td><button class="delete-btn">Delete</button></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>© 2026 Hiraiable</p>
    </footer>
<script src="script.js"></script>
</body>
</html>
